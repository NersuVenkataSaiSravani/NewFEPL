name: FRONT END DEPLOYMENT

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
   build:
      runs-on: ubuntu-latest
         
      steps:
          - name: Get Code
            uses: actions/checkout@v4

          - name: Check Files
            run: |
                ls
                echo "Front End Files Are Found"

          - name: Upload Website
            uses: actions/upload-pages-artifact@v4
            with: 
                path: .

   deploy:
     needs: build
     runs-on: ubuntu-latest

     environment:
        name: github-pages
        url: ${{ steps.deployment.outputs.page_url }}

     steps:
        - name: Deploy to Github Pages
          id: Deployment
          uses: actions/deploy-pages@v4
        
     
   
         
    

